<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>论坛博客 - 首页</title>
<style>
:root{
  --bg: #eef9ff; /* 浅蓝色底色 */
  --primary:#1f8efc;
  --card:#ffffff;
  --muted:#667;
  --maxw:1100px;
  --content-max:860px; /* 搜索框与文章卡片统一宽度 */
}
html,body{height:100%;margin:0;font-family:Inter,system-ui,Arial;color:#102a43;background:var(--bg);} 
.topbar{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--bg);box-shadow:none;border-bottom:1px solid rgba(0,0,0,0.04)}
.container{max-width:var(--maxw);margin:0 auto;display:flex;align-items:center;width:100%}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:44px;height:44px;border-radius:8px;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700}
.spacer{flex:1}
.login-btn{background:transparent;border:1px solid rgba(0,0,0,0.06);padding:8px 12px;border-radius:8px;cursor:pointer}
.header-row{max-width:var(--maxw);margin:18px auto;display:flex;gap:12px;padding:0 16px}
.panel{background:var(--card);border-radius:10px;padding:14px;box-shadow:none;border:1px solid rgba(0,0,0,0.04)}
.left{width:240px;min-height:120px}
.right{flex:1;display:flex;justify-content:flex-end;align-items:center}
.search-wrap{display:flex;justify-content:center;margin-top:12px}
.search{width:100%;max-width:var(--content-max);display:flex;gap:8px;background:#fff;padding:14px;border-radius:10px;box-shadow:0 8px 22px rgba(16,42,67,0.06)}
.search input{flex:1;border:0;outline:none;font-size:16px}
.search button{background:var(--primary);color:#fff;border:0;padding:10px 14px;border-radius:8px;cursor:pointer}
.columns{max-width:var(--maxw);margin:18px auto;display:grid;grid-template-columns:1fr 320px;gap:18px;padding:0 16px}
.list{display:flex;flex-direction:column;gap:12px;max-width:var(--content-max);margin:0 auto;align-items:stretch}
.card{background:var(--card);padding:18px;border-radius:10px;border:1px solid rgba(0,0,0,0.04);width:100%;min-height:180px}
.card h3{margin:0;font-size:18px}
.meta{color:var(--muted);font-size:13px;margin-top:6px}
.aside .card{padding:12px}
.tag{display:inline-block;padding:4px 8px;border-radius:6px;background:#eef6ff;color:var(--primary);font-size:12px;margin-right:6px}
.likes{display:inline-block;padding:4px 8px;border-radius:6px;background:#fff7e6;color:#b35700;font-size:12px;margin-right:8px;border:1px solid rgba(0,0,0,0.04)}
@media(max-width:900px){ .header-row{flex-direction:column;gap:8px}.columns{grid-template-columns:1fr} .left{width:100%} .card{width:100%;max-width:100%} }
</style>
</head>
<body>
<header class="topbar">
  <div class="container">
    <div class="brand"><div class="logo">博</div><div><strong>论坛博客</strong><div style="font-size:12px;color:var(--muted)">社区 · 分享</div></div></div>
    <div class="spacer"></div>
    <button id="openLogin" class="login-btn">登录 / 注册</button>
  </div>
</header>

<section class="header-row">
  <div class="panel left" id="trafficPanel">
    <h4>网站流量</h4>
    <div id="trafficValue" style="font-size:28px;margin-top:8px;color:var(--primary)">–</div>
    <div style="font-size:12px;color:var(--muted);margin-top:6px">实时在线 / 今日访问</div>
  </div>
  <div class="panel right">
    <div style="text-align:right">
      <div style="font-size:14px;color:var(--muted)">欢迎访问</div>
      <div style="font-size:16px;font-weight:600">探索优质文章</div>
    </div>
  </div>
</section>

<section class="search-wrap">
  <div class="search">
    <input id="searchInput" placeholder="搜索文章标题或内容..." />
    <button id="searchBtn">搜索</button>
  </div>
</section>

<section class="columns">
  <div class="list" id="articleList">
    <!-- 文章由 JS 动态渲染 -->
  </div>

</section>

<!-- 把“显示更多”按钮放在文章列表下方并居中 -->
<div style="max-width:var(--maxw);margin:8px auto;text-align:center;padding:0 16px">
  <button id="toggleMoreBtn" class="login-btn" style="display:none">显示更多</button>
</div>

<!-- 登录弹窗（示例，无后端校验需对接 /api/login /api/register） -->
<div id="loginModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.45);align-items:center;justify-content:center;">
  <div style="background:#fff;padding:18px;border-radius:10px;min-width:320px">
    <h3>登录 / 注册</h3>
    <input id="loginName" placeholder="用户名" style="width:100%;padding:8px;margin-top:8px" />
    <input id="loginPwd" type="password" placeholder="密码" style="width:100%;padding:8px;margin-top:8px" />
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:12px">
      <button id="closeLogin">取消</button>
      <button id="doRegister" style="background:#fff;color:var(--primary);border:1px solid var(--primary);padding:8px 12px;border-radius:6px">注册</button>
      <button id="doLogin" style="background:var(--primary);color:#fff;border:0;padding:8px 12px;border-radius:6px">登录</button>
    </div>
  </div>
</div>

<script>
const api = (path, opts)=>fetch(path, opts).then(r=>r.ok?r.json():r.json().then(e=>Promise.reject(e)));

async function loadTraffic(){
  try{
    const data = await fetch('/api/metrics').then(r=>r.json()).catch(()=>({online:0,daily:0}));
    document.getElementById('trafficValue').textContent = `${data.online || 0} 在线 • ${data.daily || 0} 日访问`;
  }catch(e){ console.warn(e) }
}
let _lastArticles = [];
let _collapsed = true;
const COLLAPSE_LIMIT = 5;

function applyCollapse(){
  const items = document.querySelectorAll('#articleList .card');
  items.forEach((it, idx)=>{
    if(_collapsed && idx >= COLLAPSE_LIMIT) it.style.display = 'none';
    else it.style.display = '';
  });
  const btn = document.getElementById('toggleMoreBtn');
  if(!btn) return;
  btn.style.display = _lastArticles.length > COLLAPSE_LIMIT ? 'inline-block' : 'none';
  btn.textContent = _collapsed ? `显示更多 (${Math.max(0, _lastArticles.length - COLLAPSE_LIMIT)})` : '收起';
}

document.getElementById('toggleMoreBtn').addEventListener('click', ()=>{
  _collapsed = !_collapsed;
  applyCollapse();
});

async function loadArticles(q=''){
  const list = document.getElementById('articleList'); list.innerHTML='加载中...';
  try{
    const rows = await fetch('/api/articles?search='+encodeURIComponent(q)).then(r=>r.json());
    _lastArticles = rows || [];
    list.innerHTML = _lastArticles.length ? _lastArticles.map((a)=>renderCard(a)).join('') : '<div class="card">无结果</div>';
    // 默认收起多余文章
    _collapsed = true;
    applyCollapse();
  }catch(e){
    console.error('loadArticles error:', e);
    const msg = (e && e.message) ? e.message : '加载失败';
    list.innerHTML = `<div class="card">${msg}</div>`;
  }
}
function renderCard(a){
  const excerpt = (a.content||'').slice(0,220).replace(/(\r\n|\n)/g,' ');
  return `<article class="card"><h3><a href="article.html?id=${a.id}">${escapeHtml(a.title)}</a></h3>
    <div class="meta">作者：${escapeHtml(a.owner)} · ${a.created_at||''} · 阅读 ${a.views||a.likes||0}</div>
    <p style="margin-top:8px;color:#233">${escapeHtml(excerpt)}...</p>
    <div style="margin-top:10px;display:flex;gap:8px;align-items:center">
      <span class="likes">👍 ${a.likes||0}</span>
      <a class="tag" href="article.html?id=${a.id}">阅读全文</a>
    </div></article>`;
}
function escapeHtml(s){ return (s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

document.getElementById('searchBtn').addEventListener('click', ()=>loadArticles(document.getElementById('searchInput').value));
// 支持在输入框按 Enter 键触发搜索
document.getElementById('searchInput').addEventListener('keydown', (e)=>{
  if(e.key === 'Enter'){
    e.preventDefault();
    loadArticles(document.getElementById('searchInput').value);
  }
});

// Login state helpers — persist username in localStorage and switch button to profile link
function setLoggedIn(name){
  try{ localStorage.setItem('user', name); }catch(e){}
  const btn = document.getElementById('openLogin');
  btn.textContent = name;
  btn.onclick = ()=>{ location.href = '/profile.html?user=' + encodeURIComponent(name); };
  btn.classList.add('logged-in');
}

function setLoggedOut(){
  try{ localStorage.removeItem('user'); }catch(e){}
  const btn = document.getElementById('openLogin');
  btn.textContent = '登录 / 注册';
  btn.onclick = ()=>{ document.getElementById('loginModal').style.display='flex'; };
  btn.classList.remove('logged-in');
}

function initLoginState(){
  const u = (function(){ try{return localStorage.getItem('user')}catch(e){return null} })();
  if(u){ setLoggedIn(u); }
  else{ setLoggedOut(); }
}

document.getElementById('openLogin').addEventListener('click', (e)=>{
  // if logged-in, the onclick has been swapped to redirect; otherwise show modal
  const btn = e.currentTarget;
  if(btn.classList.contains('logged-in')){
    // allow default onclick to run (redirect)
    return;
  }
  document.getElementById('loginModal').style.display = 'flex';
});

document.getElementById('closeLogin').addEventListener('click', ()=>{
  document.getElementById('loginModal').style.display='none';
});

document.getElementById('doLogin').addEventListener('click', async ()=>{
  const name=document.getElementById('loginName').value.trim(), pwd=document.getElementById('loginPwd').value;
  if(!name || !pwd){ alert('请输入用户名和密码'); return; }
  try{
    const res = await fetch('/api/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({name,pwd})});
    const data = await res.json().catch(()=>({}));
    if(data && data.ok){
      document.getElementById('loginModal').style.display='none';
      setLoggedIn(name);
    }else{
      alert('登录失败');
    }
  }catch(e){ alert('网络错误'); }
});

// 注册并自动登录：调用 /api/register，然后在成功时自动登录（保存 localStorage）
document.getElementById('doRegister').addEventListener('click', async ()=>{
  const name=document.getElementById('loginName').value.trim(), pwd=document.getElementById('loginPwd').value;
  if(!name || !pwd){ alert('请输入用户名和密码'); return; }
  try{
    const res = await fetch('/api/register',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({name,pwd})});
    const data = await res.json().catch(()=>({}));
    if(res.ok){
      // 注册成功（后端返回用户对象） — 自动登录
      document.getElementById('loginModal').style.display='none';
      setLoggedIn(name);
    }else{
      // 后端可能返回 {error: '...'}
      alert((data && data.error) ? data.error : '注册失败');
    }
  }catch(e){ alert('网络错误'); }
});

initLoginState();
loadTraffic(); loadArticles();
setInterval(loadTraffic, 15000);
</script>
</body>
</html>
