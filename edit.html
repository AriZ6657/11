<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>写文章 · 编辑器</title>
<style>
:root{--primary:#1f8efc}
body{margin:0;font-family:Inter,Arial;background:#f5fbff;color:#102a43}
.container{max-width:980px;margin:20px auto;padding:16px}
.toolbar{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.input{width:100%;padding:10px;border-radius:8px;border:1px solid #dde;box-sizing:border-box;background:#fff}
.editor{display:grid;grid-template-columns:1fr 1fr;gap:12px}
textarea{width:100%;height:400px;border-radius:8px;border:1px solid #dfe;resize:vertical;padding:12px;font-family:ui-monospace,monospace}
.preview{background:#fff;padding:12px;border-radius:8px;border:1px solid #e6eefc;overflow:auto;height:400px}
.btn{padding:8px 12px;border-radius:8px;background:var(--primary);color:#fff;border:0;cursor:pointer;white-space:nowrap}
.btn.published{background:#9aa;border:0;cursor:default;opacity:0.9}
.note{font-size:13px;color:#667;margin-top:8px}
</style>
</head>
<body>
<div class="container">
  <div style="display:flex;gap:60px;align-items:center">
    <input id="title" class="input" placeholder="文章标题" />
    <button id="save" class="btn">保存并发布</button>
    <button id="back" class="btn" style="background:#eef0f3;color:#102a43">返回个人主页</button>
  </div>

  <div class="editor" style="margin-top:12px">
    <textarea id="md" placeholder="在此写入 Markdown 内容..."></textarea>
    <div class="preview" id="preview">实时预览</div>
  </div>

  <div class="note">支持基础 Markdown：# 标题、**加粗**、*斜体*、链接 [text](url)、换行</div>
</div>

<script>
const mdEl = document.getElementById('md'), pre = document.getElementById('preview'), titleEl=document.getElementById('title');
const user = new URLSearchParams(location.search).get('user') || (typeof localStorage !== 'undefined' ? localStorage.getItem('user') : null) || 'guest';
function md2html(s){
  if(!s) return '';
  let out = s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  out = out.replace(/^###### (.*$)/gm,'<h6>$1</h6>').replace(/^##### (.*$)/gm,'<h5>$1</h5>')
    .replace(/^#### (.*$)/gm,'<h4>$1</h4>').replace(/^### (.*$)/gm,'<h3>$1</h3>')
    .replace(/^## (.*$)/gm,'<h2>$1</h2>').replace(/^# (.*$)/gm,'<h1>$1</h1>');
  out = out.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\*(.+?)\*/g,'<em>$1</em>');
  out = out.replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  out = out.replace(/\n/g,'<br/>');
  return out;
}
mdEl.addEventListener('input', ()=> pre.innerHTML = md2html(mdEl.value));
pre.innerHTML = md2html(mdEl.value);

const articleId = new URLSearchParams(location.search).get('id');
let original = {title: '', content: '', status: '', updated_at: null};
let dirty = false;

function updatePublishButton(){
  const pub = document.getElementById('publish');
  if(!pub) return; // publish button was removed when merging save+publish; guard to avoid errors
  // default: blue and enabled
  pub.classList.remove('published');
  pub.style.background = '#0b7ee6';
  pub.disabled = false;
  pub.textContent = '发布';
  // if article exists and is published and there is no new edit -> show disabled 已发布
  if(articleId && original.status === 'published' && !dirty){
    pub.classList.add('published');
    pub.style.background = '#9aa';
    pub.disabled = true;
    pub.textContent = '已发布';
  }
}
async function loadArticle(){
  if(!articleId) return;
  const a = await fetch('/api/articles/'+articleId).then(r=>r.json()).catch(()=>null);
  if(a){ titleEl.value = a.title; mdEl.value = a.content; pre.innerHTML = md2html(a.content);
    original.title = a.title || '';
    original.content = a.content || '';
    original.status = a.status || '';
    original.updated_at = a.updated_at || null;
    dirty = false;
    updatePublishButton();
  }
}
document.getElementById('save').addEventListener('click', async ()=>{
  const payload = {title:titleEl.value||'未命名',content:mdEl.value,owner:user};
  const url = articleId ? '/api/articles/'+articleId : '/api/articles';
  const method = articleId ? 'PUT' : 'POST';
  try{
    const res = await fetch(url,{method,headers:{'content-type':'application/json'},body:JSON.stringify(payload)});
    if(!res.ok){ alert('保存失败'); return; }
    const data = await res.json().catch(()=>null);
    // determine article id (existing or newly created)
    const id = articleId || (data && data.id);
    if(!id){ alert('保存后未获得文章 ID，无法发布'); return; }
    // call publish endpoint (server requires confirm:true)
    const pubRes = await fetch('/api/articles/'+id+'/publish',{
      method: 'POST',
      headers: {'content-type':'application/json'},
      body: JSON.stringify({owner: user, confirm: true})
    });
    const pubData = await pubRes.json().catch(()=>({}));
    if(pubRes.ok){
      alert('发布成功');
      // update local snapshot and redirect to profile
      original.title = titleEl.value || '';
      original.content = mdEl.value || '';
      original.status = 'published';
      dirty = false;
      updatePublishButton();
      location.href = 'profile.html?user='+encodeURIComponent(user);
    }else{
      alert((pubData && pubData.error) ? ('发布失败：'+pubData.error) : '发布失败');
    }
  }catch(e){ alert('网络错误'); }
});
// 返回个人主页
document.getElementById('back').addEventListener('click', ()=>{
  try{
    location.href = 'profile.html?user='+encodeURIComponent(user);
  }catch(e){ /* no-op */ }
});
// mark dirty when user edits title/content
titleEl.addEventListener('input', ()=>{ dirty = (titleEl.value !== original.title) || (mdEl.value !== original.content); updatePublishButton(); });
mdEl.addEventListener('input', ()=>{ dirty = (titleEl.value !== original.title) || (mdEl.value !== original.content); updatePublishButton(); });

loadArticle();
</script>
</body>
</html>
