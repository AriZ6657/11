<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>个人中心</title>
<style>
:root{--primary:#1f8efc;--card:#fff;--muted:#667}
body{margin:0;font-family:Inter,Arial;background:#eef9ff;color:#102a43}
.container{max-width:980px;margin:28px auto;padding:0 16px;display:flex;gap:18px}
.profile-front{flex:1;background:var(--card);padding:18px;border-radius:12px;box-shadow:0 10px 30px rgba(16,42,67,0.06)}
.header{display:flex;gap:18px;align-items:center}
.avatar{width:96px;height:96px;border-radius:12px;background:linear-gradient(135deg,var(--primary),#60a8ff);display:flex;align-items:center;justify-content:center;color:#fff;font-size:32px}
.info h2{margin:0}
.meta{color:var(--muted);margin-top:6px}
.articles{margin-top:16px;display:flex;flex-direction:column;gap:10px}
.article-item{background:#fff;padding:12px;border-radius:10px;display:flex;justify-content:space-between;align-items:center}
.actions{display:flex;gap:8px}
.btn{padding:6px 10px;border-radius:8px;border:1px solid rgba(0,0,0,0.06);cursor:pointer}
.btn.published{background:#9aa;color:#fff;border:0;cursor:default;opacity:0.9}
</style>
</head>
<body>
<div class="container">
  <div class="profile-front">
    <div class="header">
      <div class="avatar" id="avatar">U</div>
      <div class="info">
        <h2 id="uname">用户名</h2>
        <div class="meta" id="uinfo">等级：- · 注册：-</div>
      </div>
    </div>

    <div style="margin-top:18px">
      <h3>我的文章</h3>
      <div class="articles" id="myArticles">加载中…</div>
    </div>
  </div>

  <div style="width:300px">
    <div style="background:var(--card);padding:14px;border-radius:12px;box-shadow:0 10px 30px rgba(16,42,67,0.06)">
      <h4>操作</h4>
      <div style="margin-top:10px">
        <button class="btn" onclick="location.href='edit.html?user='+encodeURIComponent(new URLSearchParams(location.search).get('user')||'guest')">写文章</button>
        <button class="btn" onclick="location.href='index.html'">返回首页</button>
        <button class="btn" id="logoutBtn" onclick="logout()">注销</button>
      </div>
    </div>
  </div>
</div>

<script>
const userName = new URLSearchParams(location.search).get('user') || 'guest';
async function loadProfile(){
  try{
    const u = await fetch('/api/user/'+encodeURIComponent(userName)).then(r=>r.json()).catch(()=>null);
    if(u){ document.getElementById('uname').textContent = u.name; document.getElementById('uinfo').textContent = `等级：${u.priority} · 注册：${u.created_at||'-'}`; document.getElementById('avatar').textContent = (u.name||'U')[0].toUpperCase();}
    else{ document.getElementById('uname').textContent = userName; }
    const arts = await fetch(`/api/user/${encodeURIComponent(userName)}/articles`).then(r=>r.json()).catch(()=>[]);
    const list = document.getElementById('myArticles');
    list.innerHTML = arts.length ? arts.map(a=>{
      // 如果文章已发布，标题链接到公开页面；否则链接到编辑页面
      const titleLink = a.status === 'published' ? `<a href="article.html?id=${a.id}">${a.title}</a>` : `<a href="edit.html?id=${a.id}&user=${encodeURIComponent(userName)}">${a.title} (草稿)</a>`;
      // determine publish button state: if published and not edited since published -> show disabled 已发布
      let pubBtn = `<button class="btn" onclick="publish(${a.id})">发布</button>`;
      if(a.status === 'published'){
        const publishedAt = a.published_at ? new Date(a.published_at) : null;
        const updatedAt = a.updated_at ? new Date(a.updated_at) : null;
        const editedAfterPublish = publishedAt && updatedAt && (updatedAt.getTime() > publishedAt.getTime());
        if(!editedAfterPublish){
          pubBtn = `<button class="btn published" disabled>已发布</button>`;
        } else {
          pubBtn = `<button class="btn" onclick="publish(${a.id})">发布</button>`;
        }
      }
      return `<div class="article-item"><div><strong>${titleLink}</strong><div style="font-size:12px;color:#667">${a.status} · ${a.created_at||''}</div></div><div class="actions"><button class="btn" onclick="edit(${a.id})">编辑</button>${pubBtn}</div></div>`;
    }).join('') : '<div>尚无文章</div>';
  }catch(e){ console.warn(e); document.getElementById('myArticles').innerHTML='加载失败'; }
}
function edit(id){ location.href = 'edit.html?id='+id+'&user='+encodeURIComponent(userName); }
async function publish(id){
  if(!confirm('确认发布？')) return;
  try{
    const res = await fetch('/api/articles/'+id+'/publish',{
      method: 'POST',
      headers: {'content-type':'application/json'},
      body: JSON.stringify({owner: userName, confirm: true})
    });
    const data = await res.json().catch(()=>({}));
    if(res.ok){
      loadProfile();
    }else{
      alert((data && data.error) ? ('发布失败：'+data.error) : '发布失败');
    }
  }catch(e){
    alert('网络错误');
  }
}
loadProfile();
// 注销：清除 localStorage 中的登录信息并跳回首页，首页脚本会根据 localStorage 状态恢复登录按钮
function logout(){
  try{ localStorage.removeItem('user'); }catch(e){}
  // 可选择性清除其它相关键
  location.href = '/';
}
</script>
</body>
</html>
